
{% extends 'courses/base.html' %}

{% block content %}
<h2>ثبت دانشجوی جدید</h2>

{% if errors %}
    <div class="alert">
        {{ errors }}
    </div>
{% endif %}

<form method="post">
    {% csrf_token %}

    <label for="full_name">نام و نام خانوادگی</label>
    <input
        type="text"
        id="full_name"
        name="full_name"
        required
    >

    <label for="email">ایمیل</label>
    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <button type="submit">ثبت دانشجو</button>
</form>

<a href="/api/web/students/">بازگشت به فهرست دانشجوها</a>
{% endblock %}
